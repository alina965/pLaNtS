services:
  postgres:
    image: postgres:16
    container_name: plants-postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/user-service/migrations/000001_init.sql:/docker-entrypoint-initdb.d/000001_init.sql:ro
      - ./backend/user-plants-service/migrations/000001_init.sql:/docker-entrypoint-initdb.d/000002_user_plants.sql:ro
      - ./backend/telegram-service/migrations/000001_init.sql:/docker-entrypoint-initdb.d/000003_telegram.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: plants-user-service
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://myuser:mypassword@postgres:5432/mydatabase?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 168h
      BCRYPT_COST: "10"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  user-plants-service:
    build:
      context: ./backend/user-plants-service
      dockerfile: Dockerfile
    container_name: plants-user-plants-service
    ports:
      - "8082:8082"
    environment:
      ADDR: ":8082"
      DATABASE_URL: postgres://myuser:mypassword@postgres:5432/mydatabase?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal}
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started

  plants-service:
    build:
      context: ./backend/plant-service
      dockerfile: Dockerfile
    container_name: plants-service
    ports:
      - "8081:8081"
    environment:
      ADDR: ":8081"
      TIMEOUT: "10s"
      PERENUAL_KEY: ${PERENUAL_KEY}
      REDIS_ADDR: "redis:6379"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  telegram-service:
    build:
      context: ./backend/telegram-service
      dockerfile: Dockerfile
    container_name: plants-telegram-service
    ports:
      - "8084:8084"
    environment:
      ADDR: ":8084"
      DATABASE_URL: postgres://myuser:mypassword@postgres:5432/mydatabase?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal}
      TIMEOUT: 40s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  scheduler-service:
    build:
      context: ./backend/scheduler-service
      dockerfile: Dockerfile
    container_name: plants-scheduler-service
    ports:
      - "8083:8083"
    environment:
      ADDR: ":8083"
      USER_PLANTS_URL: http://user-plants-service:8082
      TELEGRAM_URL: http://telegram-service:8084
      TIMEOUT: "30"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal}
      CRON_LOCATION: ${CRON_LOCATION:-Europe/Moscow}
    depends_on:
      - user-plants-service
      - telegram-service
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
