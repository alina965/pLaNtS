services:
  postgres:
    image: postgres:16
    container_name: plants-postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/user-service/migrations/000001_init.sql:/docker-entrypoint-initdb.d/000001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: plants-user-service
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://myuser:mypassword@postgres:5432/mydatabase?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ACCESS_TOKEN_TTL: 1m
      REFRESH_TOKEN_TTL: 168h
      BCRYPT_COST: "10"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
